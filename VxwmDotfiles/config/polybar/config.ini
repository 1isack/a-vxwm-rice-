[colors]
background = ${xrdb:color0:#1a1a1a}
foreground = ${xrdb:color7:#ffffff}
primary = ${xrdb:color1:#ffffff}
dim-grey = ${xrdb:color8:#707070}

urgent-bg = ${xrdb:color1:#ffffff}
urgent-fg = ${xrdb:color0:#1a1a1a}

[bar/mybar]
bottom = false
width = 80%
offset-x = 10%
offset-y = 8px
height = 22pt
radius = 4

border-size = 1pt
border-color = ${colors.primary}

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
module-margin = 2

font-0 = "SF Mono Nerd Font:size=10;2"

modules-left = xworkspaces 
modules-center = xwindow 
modules-right = cpu ram media date

wm-restack = generic
override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.foreground}

label-urgent = %name%
label-urgent-background = ${colors.urgent-bg}
label-urgent-foreground = ${colors.urgent-fg}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.dim-grey}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.dim-grey}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "   [CPU] "
format-prefix-foreground = ${colors.dim-grey}
label = %percentage:2%%

[module/ram]
type = internal/memory
interval = 1
format-prefix = " [RAM] "
format-prefix-foreground = ${colors.dim-grey}
label = %percentage_used:2%%

[module/media]
type = custom/text
content = " [REC] "
content-foreground = ${colors.primary}
click-left = ~/.local/bin/screenshot.sh shot
click-right = ~/.local/bin/screenshot.sh video

[module/date]
type = internal/date
interval = 1.0
date = │ %H:%M
label = %date%
label-foreground = ${colors.primary}
