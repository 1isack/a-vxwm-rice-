#################################
#            Backend            #
#################################
backend = "glx";
glx-copy-from-front = false;
use-damage = true;
vsync = true;

#################################
#           Animations          #
#################################
animations = true;
animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-transient-window = "fly-in";
animation-for-workspace-switch = "slide-left";
animation-for-prev-tag = "slide-right";
animation-for-next-tag = "slide-left";
animation-stiffness = 150.0;
animation-dampening = 25.0;
animation-window-mass = 1.5;
animation-clamping = true;

#################################
#            Opacity            #
#################################
active-opacity = 0.88;
inactive-opacity = 0.78;
frame-opacity = 0.85;
inactive-opacity-override = false;
opacity-rule = [
  "100:class_g = 'Firefox'",
  "100:class_g = 'Chromium'",
  "90:class_g = 'kitty'",
  "100:class_g = 'slop'",
  "90:class_g = 'Spotify'",
  "88:focused",
  "78:!focused"
];

#################################
#              Blur             #
#################################
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
}
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:32c"
];

#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.60;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:32c"
];

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6;

#################################
#        Rounded Corners        #
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'"
];

#################################
#          WM Settings          #
#################################
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
wintypes:
{
  tooltip       = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.90; animation = "zoom"; };
  dropdown_menu = { opacity = 0.90; animation = "zoom"; };
  normal        = { animation = "zoom"; };
  dialog        = { animation = "fly-in"; shadow = true; };
};
